<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa4b2"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#c9d1d9" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b5c"/><stop offset="1" stop-color="#8c0a22"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7bd6"/><stop offset="1" stop-color="#022a54"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="420" rx="28"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
      .float{animation:float 6s ease-in-out infinite}
      .float2{animation:float 5s ease-in-out infinite;animation-delay:-2s}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
      .w{opacity:0;animation:cycle 9s infinite}
      .w2{animation-delay:3s}.w3{animation-delay:6s}
      @keyframes cycle{0%{opacity:0;transform:translateY(10px)}6%,28%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(-10px)}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="#0E1014"/>
    <circle cx="250" cy="80" r="170" fill="#D21034" opacity=".45" filter="url(#blur)">
      <animate attributeName="cx" values="250;420;250" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="360" r="190" fill="#005293" opacity=".55" filter="url(#blur)">
      <animate attributeName="cx" values="1000;820;1000" dur="16s" repeatCount="indefinite"/>
    </circle>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect x=".5" y=".5" width="1199" height="419" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>

  <!-- status pill -->
  <rect x="80" y="78" width="190" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
  <circle cx="102" cy="95" r="5" fill="#2ea44f"/>
  <circle cx="102" cy="95" r="5" fill="none" stroke="#2ea44f" stroke-width="2">
    <animate attributeName="r" values="5;13" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="118" y="100" class="sans" font-size="14" font-weight="600" fill="#c9d1d9" letter-spacing="1">AVAILABLE TO WORK</text>

  <text x="78" y="200" class="sans" font-size="84" font-weight="800" fill="url(#title)" letter-spacing="-2">Edward P&#233;rez</text>
  <text x="80" y="245" class="sans" font-size="24" fill="#9aa4b2">Software developer. I build SaaS products.</text>

  <text x="80" y="310" class="mono" font-size="18" fill="#ff5c78">&gt;</text>
  <g class="mono" font-size="18" fill="#e6edf3">
    <text x="102" y="310" class="w">React · Next.js · TypeScript</text>
    <text x="102" y="310" class="w w2">Applied AI with Claude API + MCP</text>
    <text x="102" y="310" class="w w3">Chiriqu&#237;, Panam&#225; — remote worldwide</text>
  </g>

  <text x="80" y="362" class="mono" font-size="15" fill="#6e7681">edwardcode.com  ↗</text>

  <!-- isometric cubes -->
  <g class="float">
    <polygon points="930,110 1030,168 930,226 830,168" fill="url(#top)"/>
    <polygon points="830,168 930,226 930,336 830,278" fill="url(#left)"/>
    <polygon points="1030,168 1030,278 930,336 930,226" fill="url(#right)"/>
    <text x="930" y="176" text-anchor="middle" class="sans" font-size="34" font-weight="800" fill="#0E1014" transform="rotate(0)">EP</text>
  </g>
  <g class="float2" opacity=".85">
    <polygon points="1090,250 1125,270 1090,290 1055,270" fill="url(#top)"/>
    <polygon points="1055,270 1090,290 1090,328 1055,308" fill="url(#left)"/>
    <polygon points="1125,270 1125,308 1090,328 1090,290" fill="url(#right)"/>
  </g>
</svg>
